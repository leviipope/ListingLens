[project]
name = "listinglens"
version = "0.1.0"
description = "Focuses on inspecting, understanding, and enriching marketplace listings."
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.155.0",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
listinglens = "listinglens:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
